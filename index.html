<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHANAM - Inicio</title>
    <link rel="stylesheet" href="style/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Overlay de Búsqueda Fullscreen (Estilo Apple con Diferenciador GHANAM) -->
    <div id="search-overlay" class="flex-col items-center pt-16 px-6 sm:pt-24">
        <div class="w-full max-w-2xl search-container-mobile">
            <!-- Header del buscador móvil -->
            <div class="flex items-center justify-between mb-10">
                <span class="text-[10px] uppercase tracking-[0.4em] text-white/30 font-bold">Búsqueda Global</span>
                <button onclick="toggleSearch()" class="flex items-center space-x-2 group">
                    <span class="text-[10px] uppercase tracking-widest text-white/50 group-hover:text-white transition-colors">Cerrar</span>
                    <div class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 group-hover:bg-white/20 transition-all">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </div>
                </button>
            </div>

            <!-- Input Principal -->
            <div class="relative mb-12">
                <input type="text" id="mobile-search-input" placeholder="¿Qué estás buscando hoy?" 
                       class="w-full bg-transparent border-b border-white/20 pb-4 text-2xl font-light text-white outline-none placeholder:text-white/20">
            </div>

            <!-- Diferenciador: Grid de Búsquedas Sugeridas con Estilo Lujoso -->
            <div class="space-y-8">
                <h3 class="text-[10px] uppercase tracking-[0.3em] text-white/40 font-bold">Explora lo más exclusivo</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="suggestion-chip p-6 rounded-2xl cursor-pointer group">
                        <span class="block text-white/90 text-sm mb-1 group-hover:text-yellow-500 transition-colors">Colección Oro</span>
                        <span class="text-[9px] text-white/30 uppercase tracking-wider">Premium</span>
                    </div>
                    <div class="suggestion-chip p-6 rounded-2xl cursor-pointer group">
                        <span class="block text-white/90 text-sm mb-1 group-hover:text-yellow-500 transition-colors">Relojes Fríos</span>
                        <span class="text-[9px] text-white/30 uppercase tracking-wider">Minimalista</span>
                    </div>
                    <div class="suggestion-chip p-6 rounded-2xl cursor-pointer group">
                        <span class="block text-white/90 text-sm mb-1 group-hover:text-yellow-500 transition-colors">Accesorios</span>
                        <span class="text-[9px] text-white/30 uppercase tracking-wider">Detalles</span>
                    </div>
                    <div class="suggestion-chip p-6 rounded-2xl cursor-pointer group">
                        <span class="block text-white/90 text-sm mb-1 group-hover:text-yellow-500 transition-colors">Nuevo Éxito</span>
                        <span class="text-[9px] text-white/30 uppercase tracking-wider">Tendencia</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 flex justify-center p-4 sm:p-6">
        <nav class="apple-glass flex items-center px-4 py-2 rounded-full shadow-2xl max-w-full">
            
            <!-- Logo Nav -->
            <div class="flex items-center mr-4 sm:mr-6 border-r border-white/10 pr-4 sm:pr-6">
                <img src="resource/GHANAM.png" alt="GHANAM" class="w-5 h-5 sm:w-6 sm:h-6 object-contain">
            </div>

            <!-- Links Desktop -->
            <div class="hidden md:flex items-center space-x-6 font-semibold uppercase text-gray-400">
                <a href="#" class="nav-link text-white hover:text-white">Inicio</a>
                <a href="#" class="nav-link hover:text-white">Cálidos</a>
                <a href="#" class="nav-link hover:text-white">Fríos</a>
                <a href="#" class="nav-link hover:text-white">Relojes</a>
                <a href="#" class="nav-link text-yellow-500/80 hover:text-yellow-400">Premium</a>
            </div>

            <!-- Divisor -->
            <div class="hidden md:block mx-4 h-4 w-[1px] bg-white/10"></div>

            <!-- Buscador (Trigger para el Overlay en móviles, input en PC) -->
            <div class="relative flex items-center">
                <button onclick="toggleSearch()" class="md:hidden p-2 text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
                <div class="hidden md:block relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" placeholder="Buscar" class="search-input rounded-full pl-9 pr-4 w-32 text-white text-xs">
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Section -->
    <section class="section-one">
        <div class="section-one-principal">
            <div class="section-one-content">
                
                <!-- Logo Central -->
                <div class="logo-container">
                    <img src="resource/GHANAM.png" alt="GHANAM Logo" class="main-logo-img" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <!-- Fallback -->
                    <div style="display:none;" class="text-3xl font-bold tracking-[0.4em] text-gray-900 uppercase">
                        GHANAM
                    </div>
                </div>

                <!-- Eslogan -->
                <p class="slogan px-4">
                    "Acompañamos a cada hombre y mujer en el éxito más grande"
                </p>

                <!-- CTA -->
                <div class="mt-10">
                    <button class="px-10 py-3.5 bg-gray-900 hover:bg-black text-white rounded-full text-[10px] uppercase tracking-[0.2em] transition-all duration-300 shadow-lg hover:shadow-xl active:scale-95">
                        Explorar Colección
                    </button>
                </div>

            </div>
        </div>
    </section>
    <script src="js/script.js"></script>

</body>

</html>
